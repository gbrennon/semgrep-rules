rules:
  - id: typescript-avoid-deeply-nested-conditionals
    languages: [typescript]
    severity: WARNING
    message: "Avoid deeply nested conditional control flow; extract a helper or use guard clauses"
    metadata:
      category: maintainability
      technology: [typescript]
      confidence: MEDIUM
      scope: generic-typescript
      policy: opt-in
      rationale: "Several nested conditionals increase cognitive load and make exceptional paths harder to reason about."
      references:
        - https://typescript-eslint.io/rules/max-depth/
    patterns:
      - pattern-inside: |
          if ($CONDITION) {
            ...
          }
      - pattern-inside: |
          if ($CONDITION) {
            ...
          }
      - pattern: |
          if ($CONDITION) {
            ...
          }
