rules:
  - id: csharp-avoid-deeply-nested-conditionals
    languages: [csharp]
    severity: WARNING
    message: "Avoid deeply nested conditional control flow; extract a helper or use guard clauses"
    metadata:
      category: maintainability
      technology: [csharp]
      confidence: MEDIUM
      scope: generic-csharp
      policy: opt-in
      rationale: "Several nested conditionals increase cognitive load and make exceptional paths harder to reason about."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/selection-statements
    patterns:
      - pattern-inside: |
          if ($CONDITION) {
            ...
          }
      - pattern-inside: |
          if ($CONDITION) {
            ...
          }
      - pattern-inside: |
          if ($CONDITION) {
            ...
          }
      - pattern: |
          if ($CONDITION) {
            ...
          }
