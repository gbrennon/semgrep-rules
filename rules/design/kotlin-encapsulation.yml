rules:
  - id: kotlin-public-mutable-class-property
    languages: [kotlin]
    severity: WARNING
    message: "Avoid public mutable class properties; preserve invariants behind intent-revealing methods"
    metadata:
      category: design
      technology: [kotlin]
      confidence: MEDIUM
      scope: generic-kotlin
      policy: opt-in
      rationale: "Public var properties allow callers to change state without validation or domain behavior. Prefer private state with methods that enforce invariants."
      references:
        - https://kotlinlang.org/docs/properties.html
    pattern-regex: '(?m)^\s*(?:public\s+)?var\s+[A-Za-z_][A-Za-z0-9_]*(?:\s*:\s*[^=\n]+)?\s*='

  - id: kotlin-generic-setter-method
    languages: [kotlin]
    severity: WARNING
    message: "Prefer intent-revealing state transitions over generic setter methods"
    metadata:
      category: design
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "Generic setters expose representation-level mutation and make it harder to enforce domain invariants."
      references:
        - https://kotlinlang.org/docs/functions.html
    pattern-regex: '(?m)^\s*(?:public\s+)?fun\s+set[A-Z][A-Za-z0-9_]*\s*\('
