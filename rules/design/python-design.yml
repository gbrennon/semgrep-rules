rules:
  - id: python-class-max-5-public-methods
    languages: [python]
    severity: WARNING
    message: "Class $CLASS defines more than 5 public methods; decompose to preserve single responsibility"
    metadata:
      category: design
      technology: [python]
      confidence: HIGH
      scope: generic-python
      policy: opt-in
      rationale: "Classes with broad public interfaces tend to accumulate disparate responsibilities. Refactor into smaller collaborating classes."
      references:
        - https://en.wikipedia.org/wiki/Single-responsibility_principle
    pattern-regex: '(?ms)^\s*class\b(?:(?!^\s*class\b).)*?(?:^\s+def\s+[a-zA-Z][a-zA-Z0-9_]*\s*\(.*?){6,}'

  - id: python-class-max-3-private-methods
    languages: [python]
    severity: WARNING
    message: "Class $CLASS defines more than 3 private helper methods; extract hidden collaborators"
    metadata:
      category: design
      technology: [python]
      confidence: HIGH
      scope: generic-python
      policy: opt-in
      rationale: "Multiple private helpers indicate internal complexity that deserves its own dedicated abstraction."
      references:
        - https://refactoring.guru/smells/large-class
    pattern-regex: '(?ms)^\s*class\b(?:(?!^\s*class\b).)*?(?:^\s+def\s+_[a-zA-Z0-9][a-zA-Z0-9_]*\s*\(.*?){4,}'

  - id: python-no-private-member-access
    languages: [python]
    severity: WARNING
    message: "Direct access to private member $OBJ.$M from outside defining scope violates encapsulation"
    metadata:
      category: design
      technology: [python]
      confidence: MEDIUM
      scope: generic-python
      policy: opt-in
      rationale: "Accessing non-public variables or methods bypasses class encapsulation boundaries."
      references:
        - https://peps.python.org/pep-0008/#descriptive-naming-styles
    patterns:
      - pattern: $OBJ.$M
      - pattern-not: self.$M
      - pattern-not: cls.$M
      - metavariable-regex:
          metavariable: $M
          regex: '^_[a-zA-Z0-9][a-zA-Z0-9_]*(?<!__)$'
