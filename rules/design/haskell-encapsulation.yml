rules:
  - id: haskell-unsafe-global-mutable-state
    languages: [generic]
    severity: ERROR
    message: "Do not expose mutable global state created with unsafePerformIO; encapsulate state behind controlled operations"
    metadata:
      category: design
      technology: [haskell]
      confidence: HIGH
      scope: generic-haskell
      policy: opt-in
      rationale: "Combining unsafePerformIO with IORef, MVar, or TVar creates hidden global mutation that bypasses explicit effect boundaries and invariants."
      references:
        - https://hackage.haskell.org/package/base/docs/System-IO-Unsafe.html#v:unsafePerformIO
    pattern-regex: '\bunsafePerformIO\b[^\n]*(?:IORef|MVar|TVar)|\b(?:IORef|MVar|TVar)\b[^\n]*\bunsafePerformIO\b'

  - id: haskell-setter-like-function
    languages: [generic]
    severity: WARNING
    message: "Prefer intention-revealing domain operations over generic setter-like functions"
    metadata:
      category: design
      technology: [haskell]
      confidence: MEDIUM
      scope: generic-haskell
      policy: opt-in
      rationale: "Top-level functions named setX commonly expose representation-oriented mutation; explicit domain operations make invariants easier to preserve."
      references:
        - https://www.haskell.org/onlinereport/haskell2010/haskellch5.html
    pattern-regex: '^\s*set[A-Z][A-Za-z0-9_]*\s*(?:::|=)'
