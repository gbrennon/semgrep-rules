rules:
- id: haskell-setter-like-function
  languages:
  - generic
  severity: WARNING
  message: Prefer intention-revealing domain operations over generic setter-like functions
  metadata:
    category: design
    technology:
    - haskell
    confidence: MEDIUM
    scope: generic-haskell
    policy: opt-in
    rationale: Top-level functions named setX commonly expose representation-oriented mutation; explicit domain operations
      make invariants easier to preserve.
    references:
    - https://www.haskell.org/onlinereport/haskell2010/haskellch5.html
  pattern-regex: ^\s*set[A-Z][A-Za-z0-9_]*\s*(?:::|=)
