rules:
- id: kotlin-public-mutable-class-property
  languages:
  - kotlin
  severity: WARNING
  message: Avoid public mutable class properties; preserve invariants behind intent-revealing methods
  metadata:
    category: design
    technology:
    - kotlin
    confidence: MEDIUM
    scope: generic-kotlin
    policy: opt-in
    rationale: Public var properties allow callers to change state without validation or domain behavior. Prefer private state
      with methods that enforce invariants.
    references:
    - https://kotlinlang.org/docs/properties.html
  pattern-regex: (?m)^\s*(?:public\s+)?var\s+[A-Za-z_][A-Za-z0-9_]*(?:\s*:\s*[^=\n]+)?\s*=
