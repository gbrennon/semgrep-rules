rules:
  - id: csharp-no-public-mutable-fields
    languages: [csharp]
    severity: ERROR
    message: "Do not expose mutable public fields; encapsulate state behind behavior"
    metadata:
      category: design
      technology: [csharp]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Public mutable fields let callers bypass invariants and make state changes difficult to control."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/fields
    patterns:
      - pattern-regex: '(?m)^\s*public\s+(?!const\b|readonly\b|static\s+readonly\b)(?:[A-Za-z_][\w.<>?,\[\]]*\s+)+[A-Za-z_]\w*\s*(?:=\s*[^;]+)?;'

  - id: csharp-no-setter-methods
    languages: [csharp]
    severity: WARNING
    message: "Avoid generic setter methods; expose intention-revealing behavior instead"
    metadata:
      category: design
      technology: [csharp]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Generic setters expose representation and make it harder to enforce invariants at mutation boundaries."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/methods
    pattern-regex: '(?m)^\s*(?:public|internal|protected)\s+(?:static\s+)?(?:async\s+)?[A-Za-z_][\w.<>?,\[\]]*\s+Set[A-Za-z_]\w*\s*\([^;{}]*\)\s*(?:\{|=>)'
