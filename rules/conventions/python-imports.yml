rules:
  - id: python-no-wildcard-imports
    languages: [python]
    message: "Wildcard imports are not allowed; import explicit names instead"
    severity: ERROR
    metadata:
      category: conventions
      technology: [python]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Explicit imports make module dependencies and public names reviewable."
      references:
        - https://peps.python.org/pep-0008/#imports
    patterns:
      - pattern: from $MODULE import *
