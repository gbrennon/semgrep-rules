rules:
- id: scala-no-wildcard-imports
  languages:
  - scala
  severity: WARNING
  message: Avoid wildcard imports; import the symbols used by this file explicitly
  metadata:
    category: conventions
    technology:
    - scala
    confidence: HIGH
    scope: generic-scala
    policy: opt-in
    rationale: Wildcard imports obscure dependencies, increase name-collision risk, and make code review and static analysis
      less precise.
    references:
    - https://docs.scala-lang.org/scala3/reference/changed-features/imports.html
  pattern-regex: ^\s*import\s+[^\n]*(?:\._|\.{0,1}\*)\s*$
