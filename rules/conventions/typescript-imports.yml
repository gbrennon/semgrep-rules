rules:
  - id: typescript-no-wildcard-namespace-imports
    languages: [typescript]
    severity: WARNING
    message: "Avoid wildcard namespace imports; import only the symbols used by this file"
    metadata:
      category: conventions
      technology: [typescript]
      confidence: HIGH
      scope: generic-typescript
      policy: opt-in
      rationale: "Namespace imports obscure dependencies and make name collisions and unused dependencies harder to spot."
      references:
        - https://www.typescriptlang.org/docs/handbook/2/modules.html
    pattern: import * as $NAMESPACE from $MODULE

  - id: typescript-no-require-in-es-modules
    languages: [typescript]
    severity: WARNING
    message: "Use TypeScript import syntax instead of CommonJS require"
    metadata:
      category: conventions
      technology: [typescript]
      confidence: HIGH
      scope: generic-typescript
      policy: opt-in
      rationale: "Static imports preserve module structure for the compiler and tooling and keep module conventions consistent."
      references:
        - https://www.typescriptlang.org/docs/handbook/modules.html
    pattern: require($MODULE)

  - id: typescript-no-import-file-extensions
    languages: [typescript]
    severity: WARNING
    message: "Do not include a TypeScript source extension in imports"
    metadata:
      category: conventions
      technology: [typescript]
      confidence: MEDIUM
      scope: generic-typescript
      policy: opt-in
      rationale: "Importing .ts or .tsx source extensions is inconsistent across TypeScript module resolution and can break emitted JavaScript imports."
      references:
        - https://www.typescriptlang.org/tsconfig#allowImportingTsExtensions
    patterns:
      - pattern: import $IMPORT from "$MODULE"
      - metavariable-regex:
          metavariable: $MODULE
          regex: '.*\.(?:ts|tsx).*'
