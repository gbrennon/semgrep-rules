rules:
  - id: csharp-no-using-static
    languages: [csharp]
    severity: WARNING
    message: "Avoid using static imports; qualify members or import only the required type"
    metadata:
      category: conventions
      technology: [csharp]
      confidence: HIGH
      scope: generic-csharp
      policy: opt-in
      rationale: "Static imports obscure where members come from and increase collision risk."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/using-directive
    pattern-either:
      - pattern: using static $TYPE;
      - pattern: global using static $TYPE;

  - id: csharp-no-global-namespace-imports
    languages: [csharp]
    severity: WARNING
    message: "Avoid global namespace imports; keep dependencies local to the files that use them"
    metadata:
      category: conventions
      technology: [csharp]
      confidence: MEDIUM
      scope: generic-csharp
      policy: opt-in
      rationale: "Global using directives act like wildcard-like imports and hide dependencies from individual files."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/using-directive
    pattern: global using $NAMESPACE;
