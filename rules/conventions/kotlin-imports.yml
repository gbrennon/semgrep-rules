rules:
  - id: kotlin-no-wildcard-imports
    languages: [kotlin]
    severity: WARNING
    message: "Avoid wildcard imports; import the symbols used by this file explicitly"
    metadata:
      category: conventions
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "Wildcard imports obscure dependencies, increase name-collision risk, and make code review and static analysis less precise."
      references:
        - https://kotlinlang.org/docs/coding-conventions.html#imports
    pattern-regex: '^\s*import\s+[^\n]*\.\*\s*$'
