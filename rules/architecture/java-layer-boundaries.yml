rules:
  - id: java-domain-no-infrastructure-imports
    languages: [java]
    severity: ERROR
    message: "Domain layer must not import presentation, framework, or persistence packages"
    metadata:
      category: architecture
      technology: [java]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "The domain should remain independent of delivery mechanisms, frameworks, and persistence details so business rules can be tested and reused in isolation."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/domain/**/*.java"
    pattern-regex: '^\s*import\s+(?:[^;]*(?:springframework|jakarta\.persistence|javax\.persistence|hibernate|jdbc|servlet|controller|presentation|web|rest)[^;]*)\s*;'

  - id: java-application-no-presentation-imports
    languages: [java]
    severity: ERROR
    message: "Application layer must not depend on presentation or controller packages"
    metadata:
      category: architecture
      technology: [java]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Application services coordinate use cases and ports; dependencies on controllers or web presentation details reverse the intended dependency direction."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/application/**/*.java"
    pattern-regex: '^\s*import\s+(?:[^;]*(?:controller|controllers|presentation|presenter|web|rest|views|servlet)[^;]*)\s*;'

  - id: java-presentation-direct-database-access
    languages: [java]
    severity: ERROR
    message: "Presentation layer must not access the database directly; delegate to an application use case"
    metadata:
      category: architecture
      technology: [java]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Controllers and presentation adapters should translate requests and responses, not contain persistence concerns or database queries."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/presentation/**/*.java"
        - "**/controller/**/*.java"
        - "**/controllers/**/*.java"
        - "**/web/**/*.java"
    pattern-either:
      - pattern: DriverManager.getConnection(...)
      - pattern: $CONNECTION.prepareStatement(...)
      - pattern: $CONNECTION.createStatement(...)
      - pattern: $ENTITY_MANAGER.createQuery(...)
      - pattern: $ENTITY_MANAGER.createNativeQuery(...)
