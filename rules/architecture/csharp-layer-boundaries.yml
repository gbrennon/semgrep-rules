rules:
  - id: csharp-domain-no-outward-layer-usings
    languages: [csharp]
    severity: ERROR
    message: "Domain code must not import application, presentation, or infrastructure layers"
    metadata:
      category: architecture
      technology: [csharp]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Domain code should remain independent from delivery, orchestration, and technical adapter details."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/domain/**"
    patterns:
      - pattern: using $NAMESPACE;
      - metavariable-regex:
          metavariable: $NAMESPACE
          regex: '.*(?:Application|Presentation|Infrastructure|Adapters?)(?:\.|$).*'

  - id: csharp-application-no-presentation-usings
    languages: [csharp]
    severity: ERROR
    message: "Application code must not import presentation or delivery layers"
    metadata:
      category: architecture
      technology: [csharp]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Application services should coordinate use cases without coupling to delivery mechanisms."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/application/**"
    patterns:
      - pattern: using $NAMESPACE;
      - metavariable-regex:
          metavariable: $NAMESPACE
          regex: '.*(?:Presentation|Controllers?|Views?|Routes?|Api)(?:\.|$).*'

  - id: csharp-presentation-no-direct-database-access
    languages: [csharp]
    severity: ERROR
    message: "Presentation code must delegate to application use cases instead of accessing the database directly"
    metadata:
      category: architecture
      technology: [csharp]
      confidence: MEDIUM
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Delivery adapters should invoke application ports rather than bypassing application policies with direct database access."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/presentation/**"
        - "**/controllers/**"
        - "**/routes/**"
        - "**/api/**"
    pattern-either:
      - pattern: $DB.Execute(...)
      - pattern: $DB.ExecuteAsync(...)
      - pattern: $DB.Query(...)
      - pattern: $DB.QueryAsync(...)
      - pattern: $DB.ExecuteSqlRaw(...)
      - pattern: $DB.FromSqlRaw(...)
      - pattern: new SqlCommand(...)
      - pattern: new System.Data.SqlClient.SqlCommand(...)
