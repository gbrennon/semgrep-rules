rules:
- id: typescript-presentation-no-direct-database-access
  languages:
  - typescript
  severity: ERROR
  message: Presentation code must delegate to application use cases instead of querying the database directly
  metadata:
    category: architecture
    technology:
    - typescript
    confidence: MEDIUM
    scope: conventional-hexagonal
    policy: opt-in
    rationale: Delivery adapters should invoke application ports rather than bypassing application policies with direct database
      access.
    references:
    - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
  paths:
    include:
    - '**/presentation/**'
    - '**/controllers/**'
    - '**/routes/**'
    - '**/api/**'
  pattern-either:
  - pattern: $DB.query(...)
  - pattern: $DB.execute(...)
  - pattern: $DB.raw(...)
  - pattern: prisma.$queryRaw(...)
  - pattern: prisma.$executeRaw(...)
