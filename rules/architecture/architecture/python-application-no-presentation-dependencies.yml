rules:
- id: python-application-no-presentation-dependencies
  languages:
  - python
  severity: ERROR
  message: Application layer must not depend on presentation layer or controllers
  metadata:
    category: architecture
    technology:
    - python
    confidence: HIGH
    scope: conventional-hexagonal
    policy: opt-in
    rationale: Dependencies must point inward. Application services coordinate domain logic and ports, but must never know
      how results are presented.
    references:
    - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
  paths:
    include:
    - '**/application/**'
  patterns:
  - pattern-either:
    - pattern: import $PKG
    - pattern: from $PKG import $X
    - pattern: from $PKG import *
  - metavariable-regex:
      metavariable: $PKG
      regex: (?:\b|_)(presentation|views|controllers|api|routes)(\b|_)
