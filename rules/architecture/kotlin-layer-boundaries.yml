rules:
  - id: kotlin-domain-no-outward-layer-imports
    languages: [kotlin]
    severity: ERROR
    message: "Domain code must not import application, presentation, or infrastructure layers"
    metadata:
      category: architecture
      technology: [kotlin]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "The domain model should remain independent from delivery, orchestration, and technical adapter details."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/domain/**"
    pattern-regex: '^\s*import\s+[^\n]*(?:application|presentation|infrastructure|infra|adapter|adapters)(?:[./]|\s|$)'

  - id: kotlin-application-no-presentation-imports
    languages: [kotlin]
    severity: ERROR
    message: "Application code must not import presentation or delivery layers"
    metadata:
      category: architecture
      technology: [kotlin]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Application services coordinate use cases and ports without coupling to HTTP, CLI, UI, or other delivery mechanisms."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/application/**"
    pattern-regex: '^\s*import\s+[^\n]*(?:presentation|controller|controllers|view|views|routes|api)(?:[./]|\s|$)'

  - id: kotlin-presentation-no-direct-database-access
    languages: [kotlin]
    severity: ERROR
    message: "Presentation code must delegate database access to application or repository code"
    metadata:
      category: architecture
      technology: [kotlin]
      confidence: MEDIUM
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Delivery adapters should parse input, invoke application ports, and serialize output rather than bypassing application policies with direct database calls."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/presentation/**"

    pattern-either:
      - pattern: $DB.query(...)
      - pattern: $DB.execute(...)
      - pattern: $DB.rawQuery(...)
      - pattern: $DB.execSQL(...)
      - pattern: $DB.prepareStatement(...)
      - pattern: DriverManager.getConnection(...)
      - pattern: java.sql.DriverManager.getConnection(...)

  - id: kotlin-application-no-infrastructure-imports
    languages: [kotlin]
    severity: ERROR
    message: "Application code must depend on ports, not infrastructure adapters"
    metadata:
      category: architecture
      technology: [kotlin]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Concrete database, filesystem, messaging, and network adapters belong outside application orchestration and should be supplied through ports."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/application/**"
    pattern-regex: '^\s*import\s+[^\n]*(?:infrastructure|infra|adapter|adapters)(?:[./]|\s|$)'
