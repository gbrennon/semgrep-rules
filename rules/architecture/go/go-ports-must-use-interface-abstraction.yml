rules:
- id: go-ports-must-use-interface-abstraction
  languages:
  - go
  severity: ERROR
  metadata:
    category: architecture
    technology:
    - go
    confidence: MEDIUM
    scope: conventional-hexagonal
    policy: opt-in
    rationale: Ports should be explicit boundary abstractions, separated by direction and kept free of concrete adapters.
    references:
    - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
  message: Ports should use the language interface abstraction instead of a concrete declaration
  paths:
    include:
    - '**/application/ports/inbound/**'
    - '**/application/ports/outbound/**'
  pattern-regex: |-
    (?m)^\s*type\s+\w*(?:Port|Gateway|Repository|UseCase)\w*\s+struct\b
