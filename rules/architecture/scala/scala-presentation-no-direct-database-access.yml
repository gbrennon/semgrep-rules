rules:
- id: scala-presentation-no-direct-database-access
  languages:
  - scala
  severity: ERROR
  message: Presentation code must delegate to application use cases instead of querying the database directly
  metadata:
    category: architecture
    technology:
    - scala
    confidence: MEDIUM
    scope: conventional-hexagonal
    policy: opt-in
    rationale: Delivery adapters should parse input, invoke application ports, and serialize output. Direct database access
      bypasses application policies and domain rules.
    references:
    - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
  paths:
    include:
    - '**/presentation/**'
    - '**/controllers/**'
    - '**/routes/**'
    - '**/api/**'
  pattern-either:
  - pattern: $DB.run(...)
  - pattern: $DB.execute(...)
  - pattern: $DB.query(...)
  - pattern: $CONNECTION.prepareStatement(...)
  - pattern: $JDBC.query(...)
