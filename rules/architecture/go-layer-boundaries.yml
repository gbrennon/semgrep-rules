rules:
  - id: go-domain-no-infrastructure-imports
    languages: [go]
    message: "Domain packages must not import infrastructure packages"
    severity: ERROR
    metadata:
      category: architecture
      technology: [go]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Keep domain code independent from infrastructure adapters and frameworks."
      references:
        - https://go.dev/doc/modules/layout
    paths:
      include:
        - "**/domain/**"
    pattern-regex: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"[^"\n]*(?:^|[/._-])infrastructure(?:[/._-]|\")'

  - id: go-domain-no-application-or-presentation-imports
    languages: [go]
    message: "Domain packages must not import application or presentation packages"
    severity: ERROR
    metadata:
      category: architecture
      technology: [go]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Dependencies should point inward; domain logic should not depend on orchestration or delivery layers."
      references:
        - https://go.dev/doc/modules/layout
    paths:
      include:
        - "**/domain/**"
    pattern-regex: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"[^"\n]*(?:^|[/._-])(?:application|presentation)(?:[/._-]|\")'

  - id: go-application-no-presentation-imports
    languages: [go]
    message: "Application packages must not import presentation packages"
    severity: ERROR
    metadata:
      category: architecture
      technology: [go]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Application services should coordinate use cases without coupling to delivery mechanisms."
      references:
        - https://go.dev/doc/modules/layout
    paths:
      include:
        - "**/application/**"
    pattern-regex: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"[^"\n]*(?:^|[/._-])presentation(?:[/._-]|\")'

  - id: go-presentation-no-direct-database-access
    languages: [go]
    message: "Presentation packages should delegate database access to application or repository code"
    severity: ERROR
    metadata:
      category: architecture
      technology: [go]
      confidence: MEDIUM
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Keeping persistence out of handlers reduces coupling and preserves application-layer boundaries."
      references:
        - https://go.dev/doc/modules/layout
    paths:
      include:
        - "**/presentation/**"
    pattern-either:
      - pattern: sql.Open(...)
      - pattern: $DB.Query(...)
      - pattern: $DB.QueryContext(...)
      - pattern: $DB.Exec(...)
      - pattern: $DB.ExecContext(...)
      - pattern: $DB.QueryRow(...)
      - pattern: $DB.QueryRowContext(...)
