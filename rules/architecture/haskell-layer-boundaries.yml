rules:
  - id: haskell-domain-no-outward-layer-imports
    languages: [generic]
    severity: ERROR
    message: "Domain code must not import application, presentation, or infrastructure layers"
    metadata:
      category: architecture
      technology: [haskell]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Domain modules should remain independent from delivery, orchestration, and technical adapter details."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/domain/**"
    pattern-regex: '^\s*import\s+(?:qualified\s+)?[^\n]*(?:application|presentation|infrastructure|infra|adapter|adapters)(?:\.|\s|$)'

  - id: haskell-application-no-presentation-imports
    languages: [generic]
    severity: ERROR
    message: "Application code must not import presentation or delivery layers"
    metadata:
      category: architecture
      technology: [haskell]
      confidence: HIGH
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Application services should coordinate use cases and ports without coupling to HTTP, CLI, UI, or other delivery mechanisms."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/application/**"
    pattern-regex: '^\s*import\s+(?:qualified\s+)?[^\n]*(?:presentation|controller|controllers|view|views|routes|api)(?:\.|\s|$)'

  - id: haskell-presentation-no-direct-database-access
    languages: [generic]
    severity: ERROR
    message: "Presentation code must delegate to application use cases instead of querying the database directly"
    metadata:
      category: architecture
      technology: [haskell]
      confidence: MEDIUM
      scope: conventional-hexagonal
      policy: opt-in
      rationale: "Delivery adapters should parse input, invoke application ports, and serialize output rather than bypassing application policies with direct database calls."
      references:
        - https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    paths:
      include:
        - "**/presentation/**"
        - "**/controllers/**"
        - "**/routes/**"
        - "**/api/**"
    pattern-regex: '\b(?:runSql(?:Pool)?|runDB|executeSql|rawSql|querySql|Database\.SQL\.[A-Za-z0-9_.]+)\s*(?:\(|\$)'
