rules:
- id: typescript-no-non-null-assertion
  languages:
  - typescript
  severity: WARNING
  message: Avoid non-null assertions; prove the value is present before use
  metadata:
    category: correctness
    technology:
    - typescript
    confidence: HIGH
    scope: generic-typescript
    policy: opt-in
    rationale: The non-null assertion operator suppresses TypeScript checks and can turn a valid type into a runtime exception.
    references:
    - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#non-null-assertion-operator-postfix-
  pattern: $VALUE!
