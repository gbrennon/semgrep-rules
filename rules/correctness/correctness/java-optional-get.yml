rules:
- id: java-optional-get
  languages:
  - java
  severity: WARNING
  message: Avoid Optional.get(); handle the empty case explicitly
  metadata:
    category: correctness
    technology:
    - java
    confidence: MEDIUM
    scope: generic-java
    policy: opt-in
    rationale: Optional.get throws when the value is absent. Prefer orElse, orElseGet, orElseThrow with a meaningful exception,
      or explicit presence handling.
    references:
    - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Optional.html#get()
  patterns:
  - pattern: $OPTIONAL.get()
  - metavariable-regex:
      metavariable: $OPTIONAL
      regex: (?i)^(?:optional|opt|maybe)$
