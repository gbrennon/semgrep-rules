rules:
  - id: rust-no-mem-forget-on-lock
    languages: [rust]
    severity: ERROR
    message: "Calling std::mem::forget on a lock guard permanently leaks the lock and risks deadlocks"
    metadata:
      category: correctness
      technology: [rust]
      confidence: HIGH
      scope: generic-rust
      policy: opt-in
      rationale: "Forgetting a lock guard prevents drop cleanup and deadlocks thread executors."
      references:
        - https://doc.rust-lang.org/std/sync/struct.Mutex.html
    patterns:
      - pattern-either:
          - pattern: std::mem::forget($GUARD)
          - pattern: core::mem::forget($GUARD)
      - metavariable-regex:
          metavariable: $GUARD
          regex: '(?i)(?:guard|lock)'

  - id: rust-no-sleep-in-async-block
    languages: [rust]
    severity: ERROR
    message: "std::thread::sleep blocks the async worker thread; use tokio::time::sleep instead"
    metadata:
      category: correctness
      technology: [rust]
      confidence: HIGH
      scope: generic-rust
      policy: opt-in
      rationale: "Blocking an OS worker thread halts the async event loop for all tasks scheduled on that worker."
      references:
        - https://docs.rs/tokio/latest/tokio/time/fn.sleep.html
    patterns:
      - pattern-either:
          - pattern-inside: |
              async fn $FN(...) {
                ...
              }
          - pattern-inside: |
              async fn $FN(...) -> $RET {
                ...
              }
          - pattern-inside: |
              async {
                ...
              }
          - pattern-inside: |
              async move {
                ...
              }
      - pattern: std::thread::sleep(...)
