rules:
- id: rust-no-mem-forget-on-lock
  languages:
  - rust
  severity: ERROR
  message: Calling std::mem::forget on a lock guard permanently leaks the lock and risks deadlocks
  metadata:
    category: correctness
    technology:
    - rust
    confidence: HIGH
    scope: generic-rust
    policy: opt-in
    rationale: Forgetting a lock guard prevents drop cleanup and deadlocks thread executors.
    references:
    - https://doc.rust-lang.org/std/sync/struct.Mutex.html
  patterns:
  - pattern-either:
    - pattern: std::mem::forget($GUARD)
    - pattern: core::mem::forget($GUARD)
  - metavariable-regex:
      metavariable: $GUARD
      regex: (?i)(?:guard|lock)
