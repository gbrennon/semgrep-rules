rules:
  - id: go-explicitly-ignored-error
    languages: [go]
    message: "Do not explicitly discard an error without documenting why it is safe"
    severity: WARNING
    metadata:
      category: correctness
      technology: [go]
      confidence: HIGH
      scope: generic-go
      policy: opt-in
      rationale: "Explicitly assigning an error to the blank identifier can hide failures and make recovery impossible."
      references:
        - https://go.dev/blog/errors-are-values
    pattern-either:
      - pattern: _ = $CALL(...)
      - pattern: $FIRST, _ = $CALL(...)

  - id: go-unchecked-type-assertion
    languages: [go]
    message: "Check the boolean result of a type assertion before using the asserted value"
    severity: WARNING
    metadata:
      category: correctness
      technology: [go]
      confidence: MEDIUM
      scope: generic-go
      policy: opt-in
      rationale: "A failed single-value assertion panics; use the comma-ok form when the dynamic type is not guaranteed."
      references:
        - https://go.dev/ref/spec#Type_assertions
    pattern: $VALUE.($TYPE)

  - id: go-defer-close-error
    languages: [go]
    message: "Do not silently discard errors from deferred Close calls"
    severity: WARNING
    metadata:
      category: correctness
      technology: [go]
      confidence: MEDIUM
      scope: generic-go
      policy: opt-in
      rationale: "Close may report buffered writes or other failures; handle the error when it matters."
      references:
        - https://go.dev/doc/effective_go#defer
    pattern: defer $RESOURCE.Close()
