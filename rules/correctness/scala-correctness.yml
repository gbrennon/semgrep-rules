rules:
  - id: scala-unsafe-result-get
    languages: [scala]
    severity: WARNING
    message: "Avoid unsafe get calls on optional or failure-carrying results; handle the case explicitly"
    metadata:
      category: correctness
      technology: [scala]
      confidence: MEDIUM
      scope: generic-scala
      policy: opt-in
      rationale: "Calling get on an Option can throw for None, while calling get on a Try rethrows its captured failure. Pattern matching, fold, recover, or getOrElse makes the error path explicit."
      references:
        - https://www.scala-lang.org/api/current/scala/Option.html
        - https://www.scala-lang.org/api/current/scala/util/Try.html
    pattern: $VALUE.get

  - id: scala-blocking-await-result
    languages: [scala]
    severity: WARNING
    message: "Blocking on a Future with Await.result can starve asynchronous execution; compose the Future instead"
    metadata:
      category: correctness
      technology: [scala]
      confidence: HIGH
      scope: generic-scala
      policy: opt-in
      rationale: "Await.result blocks a thread while an asynchronous computation completes and can exhaust the execution context or deadlock under load."
      references:
        - https://www.scala-lang.org/api/current/scala/concurrent/Await$.html
    pattern-either:
      - pattern: Await.result(...)
      - pattern: scala.concurrent.Await.result(...)

  - id: scala-blocking-thread-sleep
    languages: [scala]
    severity: WARNING
    message: "Thread.sleep blocks the current execution thread; use a non-blocking scheduler or timer"
    metadata:
      category: correctness
      technology: [scala]
      confidence: HIGH
      scope: generic-scala
      policy: opt-in
      rationale: "Thread.sleep blocks a worker thread and is especially harmful inside Future, actor, or effect runtimes."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Thread.html#sleep(long)
    pattern-either:
      - pattern: Thread.sleep(...)
      - pattern: java.lang.Thread.sleep(...)
