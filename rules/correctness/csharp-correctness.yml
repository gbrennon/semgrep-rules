rules:
  - id: csharp-no-null-forgiving-operator
    languages: [csharp]
    severity: WARNING
    message: "Avoid the null-forgiving operator; prove that the value is non-null"
    metadata:
      category: correctness
      technology: [csharp]
      confidence: HIGH
      scope: generic-csharp
      policy: opt-in
      rationale: "The null-forgiving operator suppresses nullable analysis and can hide a runtime NullReferenceException."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/null-forgiving
    pattern: $VALUE!

  - id: csharp-no-blocking-task-wait
    languages: [csharp]
    severity: WARNING
    message: "Avoid blocking on tasks with Result or Wait; use await instead"
    metadata:
      category: correctness
      technology: [csharp]
      confidence: HIGH
      scope: generic-csharp
      policy: opt-in
      rationale: "Blocking task operations can deadlock synchronization contexts and waste threads."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-scenarios
    pattern-either:
      - pattern: $TASK.Result
      - pattern: $TASK.Wait(...)
      - pattern: Task.WaitAll(...)
      - pattern: Task.WaitAny(...)

  - id: csharp-no-empty-catch
    languages: [csharp]
    severity: WARNING
    message: "Do not silently swallow caught exceptions"
    metadata:
      category: correctness
      technology: [csharp]
      confidence: HIGH
      scope: generic-csharp
      policy: opt-in
      rationale: "An empty catch block hides failures and prevents diagnosis or deliberate recovery."
      references:
        - https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/exceptions/exception-handling
    pattern-regex: '(?m)catch(?:\s*\([^)]*\))?\s*\{\s*\}'
