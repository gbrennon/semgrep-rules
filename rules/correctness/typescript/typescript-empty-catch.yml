rules:
- id: typescript-empty-catch
  languages:
  - typescript
  severity: WARNING
  message: Do not silently swallow caught errors
  metadata:
    category: correctness
    technology:
    - typescript
    confidence: HIGH
    scope: generic-typescript
    policy: opt-in
    rationale: An empty catch block hides failures and makes recovery and diagnosis impossible.
    references:
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/try...catch
  pattern-either:
  - pattern: catch ($ERROR) { }
  - pattern: catch { }
