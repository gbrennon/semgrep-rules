rules:
  - id: java-optional-get
    languages: [java]
    severity: WARNING
    message: "Avoid Optional.get(); handle the empty case explicitly"
    metadata:
      category: correctness
      technology: [java]
      confidence: MEDIUM
      scope: generic-java
      policy: opt-in
      rationale: "Optional.get throws when the value is absent. Prefer orElse, orElseGet, orElseThrow with a meaningful exception, or explicit presence handling."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Optional.html#get()
    patterns:
      - pattern: $OPTIONAL.get()
      - metavariable-regex:
          metavariable: $OPTIONAL
          regex: '(?i)^(?:optional|opt|maybe)$'

  - id: java-blocking-future-get
    languages: [java]
    severity: WARNING
    message: "Blocking on Future.get can stall worker threads; prefer non-blocking composition"
    metadata:
      category: correctness
      technology: [java]
      confidence: MEDIUM
      scope: generic-java
      policy: opt-in
      rationale: "Future.get blocks until completion and can exhaust thread pools or contribute to deadlocks under load."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/Future.html#get()
    patterns:
      - pattern: $FUTURE.get()
      - metavariable-regex:
          metavariable: $FUTURE
          regex: '(?i)^(?:future|futuretask|completionstage|task)$'

  - id: java-empty-catch-block
    languages: [java]
    severity: WARNING
    message: "Do not silently swallow exceptions in an empty catch block"
    metadata:
      category: correctness
      technology: [java]
      confidence: HIGH
      scope: generic-java
      policy: opt-in
      rationale: "An empty catch block hides failures and leaves callers without a clear recovery path. Handle, propagate, or document intentionally ignored exceptions."
      references:
        - https://docs.oracle.com/javase/tutorial/essential/exceptions/catch.html
    pattern-regex: '(?m)catch\s*\([^)]*\)\s*\{\s*\}'
