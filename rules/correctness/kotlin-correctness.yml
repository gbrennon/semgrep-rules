rules:
  - id: kotlin-unsafe-non-null-assertion
    languages: [kotlin]
    severity: WARNING
    message: "Avoid the non-null assertion operator; handle the nullable case explicitly"
    metadata:
      category: correctness
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "The !! operator throws a NullPointerException when the value is null. Explicit handling makes the failure path visible and safer."
      references:
        - https://kotlinlang.org/docs/null-safety.html
    pattern-regex: '\b[A-Za-z_][A-Za-z0-9_.]*\s*!!'

  - id: kotlin-unsafe-optional-get
    languages: [kotlin]
    severity: WARNING
    message: "Avoid Optional.get(); handle the empty case explicitly"
    metadata:
      category: correctness
      technology: [kotlin]
      confidence: MEDIUM
      scope: generic-kotlin
      policy: opt-in
      rationale: "Optional.get throws when no value is present. Prefer an explicit fallback or conditional access."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Optional.html#get()
    pattern: $OPTIONAL.get()

  - id: kotlin-blocking-future-access
    languages: [kotlin]
    severity: WARNING
    message: "Avoid blocking Future or CompletableFuture access; compose asynchronous work instead"
    metadata:
      category: correctness
      technology: [kotlin]
      confidence: MEDIUM
      scope: generic-kotlin
      policy: opt-in
      rationale: "Blocking get/join calls can starve worker threads or deadlock asynchronous execution."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/Future.html#get()
        - https://kotlinlang.org/docs/coroutines-basics.html
    pattern-either:
      - pattern: $FUTURE.get(...)
      - pattern: $FUTURE.join()
      - pattern: runBlocking { ... }
      - pattern: runBlocking(...)

  - id: kotlin-empty-catch-block
    languages: [kotlin]
    severity: WARNING
    message: "Do not silently swallow exceptions; handle, report, or document the failure"
    metadata:
      category: correctness
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "An empty catch block hides failures and makes recovery behavior impossible to understand or observe."
      references:
        - https://kotlinlang.org/docs/exceptions.html
    pattern-regex: '(?ms)\bcatch\s*\([^)]*\)\s*\{\s*\}'
