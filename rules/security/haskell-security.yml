rules:
  - id: haskell-system-process-command-execution
    languages: [generic]
    severity: ERROR
    message: "Direct System.Process command execution requires strict input validation; avoid passing untrusted strings to the operating system"
    metadata:
      category: security
      technology: [haskell]
      confidence: HIGH
      scope: generic-haskell
      policy: opt-in
      rationale: "System.Process.system invokes a command through the shell. Command strings assembled from untrusted input can enable command injection."
      references:
        - https://hackage.haskell.org/package/process/docs/System-Process.html
    pattern-regex: '\b(?:System\.Process\.)?system(?:\s+|\()'

  - id: haskell-partial-read-deserialization
    languages: [generic]
    severity: ERROR
    message: "Avoid partial read for untrusted or malformed data; use explicit, validated parsing instead"
    metadata:
      category: security
      technology: [haskell]
      confidence: HIGH
      scope: generic-haskell
      policy: opt-in
      rationale: "Prelude.read throws an exception when input does not match the expected representation and is unsafe as an untrusted-data boundary."
      references:
        - https://hackage.haskell.org/package/base/docs/Prelude.html#v:read
    pattern-regex: '\bread(?:\s+|\()'

  - id: haskell-predictable-random-seed
    languages: [generic]
    severity: WARNING
    message: "Do not use a caller-controlled or fixed mkStdGen seed for security-sensitive values; use a cryptographic generator"
    metadata:
      category: security
      technology: [haskell]
      confidence: MEDIUM
      scope: generic-haskell
      policy: opt-in
      rationale: "System.Random.mkStdGen deterministically derives a generator from its seed and is not a source of unpredictable security tokens."
      references:
        - https://hackage.haskell.org/package/random/docs/System-Random.html
    pattern-regex: '\b(?:System\.Random\.)?mkStdGen(?:\s+|\()'
