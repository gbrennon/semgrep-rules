rules:
  - id: kotlin-runtime-command-execution
    languages: [kotlin]
    severity: ERROR
    message: "Direct Runtime.exec or ProcessBuilder command execution requires strict input validation"
    metadata:
      category: security
      technology: [kotlin]
      confidence: MEDIUM
      scope: generic-kotlin
      policy: opt-in
      rationale: "Runtime.exec and ProcessBuilder cross an operating-system trust boundary; untrusted command fragments can enable command injection."
      references:
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Runtime.html#exec(java.lang.String)
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/ProcessBuilder.html
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: ProcessBuilder(...)

  - id: kotlin-insecure-java-deserialization
    languages: [kotlin]
    severity: ERROR
    message: "Java ObjectInputStream deserialization is unsafe for untrusted data"
    metadata:
      category: security
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "Java native deserialization can invoke attacker-controlled gadget chains while reconstructing objects. Prefer a safe, schema-validated data format for untrusted input."
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern: $STREAM.readObject(...)

  - id: kotlin-weak-message-digest
    languages: [kotlin]
    severity: WARNING
    message: "Do not use MD5 or SHA-1 for security-sensitive hashing; use a modern collision-resistant algorithm"
    metadata:
      category: security
      technology: [kotlin]
      confidence: HIGH
      scope: generic-kotlin
      policy: opt-in
      rationale: "MD5 and SHA-1 have practical collision weaknesses and should not protect passwords, signatures, or other security-sensitive values."
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://csrc.nist.gov/projects/hash-functions
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
      - pattern: java.security.MessageDigest.getInstance("MD5")
      - pattern: java.security.MessageDigest.getInstance("SHA-1")
      - pattern: java.security.MessageDigest.getInstance("SHA1")
