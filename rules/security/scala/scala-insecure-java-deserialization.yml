rules:
- id: scala-insecure-java-deserialization
  languages:
  - scala
  severity: ERROR
  message: Java ObjectInputStream deserialization is unsafe for untrusted data
  metadata:
    category: security
    technology:
    - scala
    confidence: HIGH
    scope: generic-scala
    policy: opt-in
    rationale: Java native deserialization can invoke attacker-controlled gadget chains while reconstructing objects. Prefer
      a safe, schema-validated data format for untrusted input.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
  pattern: $STREAM.readObject(...)
