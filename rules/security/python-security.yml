rules:
  - id: python-no-eval-exec
    languages: [python]
    message: "Dynamic code execution via eval/exec is dangerous and can lead to remote code execution"
    severity: ERROR
    metadata:
      category: security
      technology: [python]
      confidence: HIGH
      scope: generic-python
      policy: opt-in
      rationale: "Dynamic code execution bypasses type safety and allows arbitrary code execution from untrusted inputs."
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python-subprocess-shell-true
    languages: [python]
    message: "Spawning subprocess with shell=True introduces command injection risks"
    severity: ERROR
    metadata:
      category: security
      technology: [python]
      confidence: HIGH
      scope: generic-python
      policy: opt-in
      rationale: "Using shell=True allows unescaped shell metacharacters in arguments to execute arbitrary commands."
      references:
        - https://docs.python.org/3/library/subprocess.html#security-considerations
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python-insecure-deserialization-pickle
    languages: [python]
    message: "Insecure deserialization via pickle allows arbitrary code execution"
    severity: ERROR
    metadata:
      category: security
      technology: [python]
      confidence: HIGH
      scope: generic-python
      policy: opt-in
      rationale: "Pickle deserialization executes arbitrary code encoded in the byte stream via the __reduce__ protocol."
      references:
        - https://docs.python.org/3/library/pickle.html
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: _pickle.load(...)
      - pattern: _pickle.loads(...)
