rules:
- id: java-insecure-objectinputstream-deserialization
  languages:
  - java
  severity: ERROR
  message: Java native deserialization is unsafe for untrusted data
  metadata:
    category: security
    technology:
    - java
    confidence: HIGH
    scope: generic-java
    policy: opt-in
    rationale: ObjectInputStream can invoke attacker-controlled gadget chains while reconstructing objects. Prefer a safe,
      schema-validated data format for untrusted input.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
  pattern: $STREAM.readObject()
