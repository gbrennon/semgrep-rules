rules:
- id: python-subprocess-shell-true
  languages:
  - python
  message: Spawning subprocess with shell=True introduces command injection risks
  severity: ERROR
  metadata:
    category: security
    technology:
    - python
    confidence: HIGH
    scope: generic-python
    policy: opt-in
    rationale: Using shell=True allows unescaped shell metacharacters in arguments to execute arbitrary commands.
    references:
    - https://docs.python.org/3/library/subprocess.html#security-considerations
  pattern-either:
  - pattern: subprocess.run(..., shell=True, ...)
  - pattern: subprocess.Popen(..., shell=True, ...)
  - pattern: subprocess.call(..., shell=True, ...)
  - pattern: subprocess.check_call(..., shell=True, ...)
  - pattern: subprocess.check_output(..., shell=True, ...)
