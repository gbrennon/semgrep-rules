rules:
  - id: rust-no-command-raw-sh-c
    languages: [rust]
    message: "Spawning shell sub-processes with -c introduces command injection risks"
    severity: ERROR
    metadata:
      category: security
      technology: [rust]
      confidence: HIGH
      scope: generic-rust
      policy: opt-in
      rationale: "Invoking sh/bash -c or cmd.exe /c parses command strings through shell interpreters, risking injection."
      references:
        - https://doc.rust-lang.org/std/process/struct.Command.html
    pattern-either:
      - pattern: Command::new("sh").arg("-c")
      - pattern: Command::new("bash").arg("-c")
      - pattern: Command::new("cmd").arg("/c")
      - pattern: Command::new("cmd.exe").arg("/c")

  - id: rust-no-insecure-random-transmute
    languages: [rust]
    message: "Transmuting arbitrary byte buffers into values can cause undefined behavior"
    severity: ERROR
    metadata:
      category: security
      technology: [rust]
      confidence: HIGH
      scope: generic-rust
      policy: opt-in
      rationale: "Unchecked std::mem::transmute on byte buffers bypasses invariant checking and may violate validity requirements."
      references:
        - https://doc.rust-lang.org/std/mem/fn.transmute.html
    pattern-either:
      - pattern: std::mem::transmute(...)
      - pattern: core::mem::transmute(...)
